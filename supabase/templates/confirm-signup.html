<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<style>@media (max-width: 480px) { .card { padding: 28px 22px 26px !important; } .code { font-size: 30px !important; letter-spacing: 6px !important; } }</style>
<title>Welcome to Nura.</title>
</head>
<body style="margin:0;padding:0;background-color:#FAF7F0;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#FAF7F0;">Your code to confirm your email is {{ .Token }}.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FAF7F0;">
  <tr>
    <td align="center" style="padding:40px 16px 48px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td style="padding:0 6px 22px;">
            <img src="https://risewithnura.com/assets/email/wordmark.png" width="84" height="24" alt="Nura" style="display:block;border:0;outline:none;text-decoration:none;">
          </td>
        </tr>
        <tr>
          <td class="card" style="background-color:#FFFFFF;border:1px solid #ECE6DA;border-radius:24px;padding:36px 32px 34px;font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#171313;">
            <img src="https://risewithnura.com/assets/email/ra-wave.png" width="80" height="89" alt="" style="display:block;border:0;outline:none;margin:0 0 20px;">
            <h1 style="margin:0 0 8px;font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-0.8px;color:#171313;">Welcome to Nura.</h1>
            <p style="margin:0 0 22px;font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#4A4340;">Enter this code in Nura to confirm your email.</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="code" align="center" style="background-color:#FAF7F0;border-radius:16px;padding:18px 12px;font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:34px;line-height:40px;font-weight:600;letter-spacing:8px;color:#171313;">{{ .Token }}</td>
              </tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0;">
              <tr>
                <td width="45%" style="border-top:1px solid #ECE6DA;font-size:0;line-height:0;">&nbsp;</td>
                <td width="10%" align="center" style="font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:12px;color:#7B7360;">or</td>
                <td width="45%" style="border-top:1px solid #ECE6DA;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="border-radius:26px;background-color:#FF6B35;">
                  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email" style="display:block;padding:15px 24px;font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:22px;font-weight:600;color:#3B1204;text-decoration:none;border-radius:26px;">Confirm my email</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:22px 6px 0;font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:19px;color:#7B7360;">
            If you didn’t make a Nura account, you can ignore this email.<br>
            <a href="https://risewithnura.com" style="color:#7B7360;text-decoration:underline;">risewithnura.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
