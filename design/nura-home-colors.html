<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nura journey, blended v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --cream:#FAF7F0; --layer:#F3EEE2; --subtle:#EFE9DB; --track:#E8E1D2; --card:#FFFFFF;
  --ink:#171313; --ink2:#4A4340; --ink3:#7B7360; --mute:#958B77;
  --hair:rgba(23,19,19,.10); --hair2:rgba(23,19,19,.18);
  --coral:#FF6B35; --coralSoft:#FFA05C; --coralDeep:#C2410C; --onCoral:#3B1204;
  --navy:#0B1029; --navy2:#111838; --navy3:#161D42; --navy4:#1E2652;
  --indigo:#4338CA; --nu:#8C97F6; --nuSoft:#B6BEFA; --nuInk3:#7E87AC;
  --t-people:#FCCBDB; --t-money:#E6D3F6; --t-work:#CFD4F7; --t-study:#CBE4F9; --t-home:#F8E7BC; --t-personal:#C7EEE4;
  --font:'Inter Tight', system-ui, sans-serif; --tight:-0.045em;
}
body.poppins{ --font:'Poppins', system-ui, sans-serif; --tight:-0.035em; }
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E6E2D8}
body{font-family:var(--font);color:var(--ink);padding:40px 48px 80px;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:18px;margin-bottom:40px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-0.02em}
.toggle{display:flex;gap:4px;padding:4px;border-radius:99px;background:#fff;border:1px solid var(--hair)}
.toggle button{font:500 13px var(--font);border:0;background:transparent;padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--ink3)}
.toggle button.on{background:var(--ink);color:var(--cream)}
.board{display:flex;flex-wrap:wrap;gap:56px 44px}
.board figure{display:flex;flex-direction:column;gap:14px}
.board figcaption{font-size:13px;color:#6b665c;font-weight:500;padding-left:6px}
.board figcaption b{color:var(--ink);font-weight:600}

/* the phone */
.phone{width:390px;height:844px;border-radius:50px;position:relative;overflow:hidden;background:var(--cream);
  box-shadow:0 0 0 9px #111114, 0 0 0 10px #2a2a2e, 0 40px 70px -20px rgba(40,30,10,.35)}
.phone.navy{background:var(--navy);color:#F2F4FB}
.phone.coral{background:var(--coral);color:var(--onCoral)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:20}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 38px;font-size:15.5px;font-weight:600;letter-spacing:-0.01em;position:relative;z-index:5}
.sb svg{display:block}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:currentColor;opacity:.9;z-index:20}

.pad{padding:0 24px}
.h{font-weight:600;letter-spacing:var(--tight);line-height:1.02}
.m{color:var(--mute)}
.navy .m{color:var(--nuInk3)}
.coral .m{color:rgba(59,18,4,.5)}
.num{font-weight:400;letter-spacing:-0.05em;line-height:.9;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:0}
.row{display:flex;align-items:center}
.circle{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.glyph{width:32px;height:32px;border-radius:50%;background:rgba(23,19,19,.07);display:flex;align-items:center;justify-content:center;flex:none}
.coral .glyph,.front .glyph{background:rgba(59,18,4,.10)}

/* nav */
.nav{position:absolute;left:16px;right:16px;bottom:26px;display:flex;gap:10px;align-items:center;z-index:10}
.nav .pill{flex:1;height:62px;border-radius:31px;background:var(--layer);display:flex;align-items:center;justify-content:space-around;border:1px solid var(--hair)}
.nav .tab{width:62px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.nav .tab i{width:5px;height:5px;border-radius:50%;background:transparent}
.nav .tab.on i{background:var(--coral)}
.nav .tell{width:62px;height:62px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center}

/* HOME — the stack */
.stack{position:absolute;left:12px;right:12px;top:214px;bottom:104px}
.band{position:absolute;left:0;right:0;height:230px;border-radius:28px;padding:0 20px;background:var(--c);
  box-shadow:0 -1px 0 rgba(255,255,255,.6) inset, 0 -8px 20px -12px rgba(40,30,10,.18)}
.band .head{height:62px;display:flex;align-items:center;gap:12px}
.band .title{flex:1;font-size:16.5px;font-weight:500;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .when{font-size:24px;letter-spacing:-0.04em;font-weight:400}
.band .when small{font-size:11px;letter-spacing:0;color:var(--ink3);margin-left:2px;font-weight:500}
.front{background:var(--coral);color:var(--onCoral);height:auto;bottom:0;padding:18px 20px 20px;display:flex;flex-direction:column}
.front .big{font-size:31px;font-weight:600;letter-spacing:var(--tight);line-height:1.04;margin-top:16px}
.front .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
.begin{width:96px;height:96px;background:var(--ink);color:var(--cream);font-size:16px;font-weight:600;letter-spacing:-0.01em}

/* TASKS — sized by time */
.words{display:flex;gap:18px;white-space:nowrap;font-size:30px;font-weight:600;letter-spacing:var(--tight);padding:0 24px;margin-top:22px}
.words span{color:var(--mute)} .words span.on{color:var(--ink)}
.words sup{font-size:11px;font-weight:500;letter-spacing:0;margin-left:2px;vertical-align:18px}
.bento{position:absolute;left:12px;right:12px;top:236px;bottom:104px;display:grid;gap:7px;
  grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr 1fr;
  grid-template-areas:"a a b" "a a b" "c c d" "e f g"}
.tile{border-radius:24px;padding:14px;background:var(--c);display:flex;flex-direction:column;position:relative;overflow:hidden}
.tile .t{font-size:14.5px;font-weight:500;letter-spacing:-0.02em;line-height:1.18;margin-top:auto}
.tile .n{font-size:30px;letter-spacing:-0.05em;position:absolute;top:12px;right:14px}
.tile .n small{font-size:11px;letter-spacing:0;color:var(--ink3);font-weight:500;margin-left:1px}
.tile.xl .t{font-size:22px;font-weight:600;letter-spacing:var(--tight);line-height:1.06}
.tile.xl .n{font-size:84px;top:auto;bottom:10px;right:16px}
.tile.xl .n small{font-size:13px}
.tile.xl .t{margin-top:18px}

/* FOCUS */
.back{font-size:15px;color:var(--ink3);font-weight:500}
.horizon{position:relative;height:230px;overflow:hidden;margin-top:14px}
.horizon .disc{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%}
.ticks{position:absolute;left:0;right:0;bottom:0;height:14px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px;border-top:1.5px solid var(--ink)}
.ticks i{width:1.5px;height:6px;background:var(--ink2);display:block}
.ticks i:nth-child(5n+1){height:12px;background:var(--ink)}
.knobs{display:flex;gap:8px;padding:0 12px;margin-top:14px}
.knob{flex:1;height:150px;border-radius:26px;background:var(--layer);padding:14px 16px;position:relative}
.knob .dial{position:absolute;right:16px;top:16px;width:84px;height:84px;background:var(--ink);border-radius:50%}
.knob .dial i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--coral)}
.knob .v{font-size:28px;letter-spacing:-0.05em;position:absolute;left:16px;bottom:34px}
.knob .v small{font-size:12px;letter-spacing:0;color:var(--ink3);font-weight:500}
.knob .l{position:absolute;left:16px;bottom:14px;font-size:12.5px;color:var(--ink2);font-weight:500}
.cells{position:absolute;left:0;right:0;bottom:0;height:196px;display:flex;border-top:1px solid var(--hair)}
.cells > div{flex:1;display:flex;align-items:center;justify-content:center}
.cells > div + div{border-left:1px solid var(--hair)}
.go{width:124px;height:124px;font-size:18px;font-weight:600;letter-spacing:-0.01em}

/* SESSION */
.player{display:flex;gap:1px;margin:0 12px;border-radius:24px;overflow:hidden;background:var(--hair)}
.player > div{flex:1;height:100px;background:var(--layer);display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600}
.ruler{position:absolute;left:12px;right:12px;bottom:34px;height:58px;border-radius:0 0 30px 30px;background:var(--ink);overflow:hidden}
.ruler .fill{position:absolute;left:0;top:0;bottom:0;background:var(--coral)}
.ruler .ts{position:absolute;left:14px;right:14px;top:0;height:22px;display:flex;justify-content:space-between;align-items:flex-start}
.ruler .ts i{width:1.5px;height:8px;background:rgba(250,247,240,.55);display:block}
.ruler .ts i:nth-child(5n+1){height:16px;background:var(--cream)}
.ruler .head{position:absolute;top:0;bottom:0;width:2px;background:var(--cream)}

/* DAY — the day in dots */
.dots{display:grid;grid-template-columns:30px repeat(8, 30px);gap:9px 8px;align-items:center;padding:0 24px;margin-top:26px}
.dots .hr{font-size:11px;color:var(--ink3);font-weight:500;text-align:left}
.dots .d{width:30px;height:30px;border-radius:50%;background:var(--track)}
.dots .d.past{background:#F0EBE0}
.dots .d.cal{background:var(--indigo)}
.dots .d.task{background:var(--coral)}
.dots .d.done{background:var(--ink)}
.dots .d.now{box-shadow:0 0 0 2.5px var(--cream),0 0 0 4.5px var(--ink)}
.stats{display:flex;justify-content:space-between;padding:0 24px;margin-top:26px}
.stat .num{font-size:38px}
.stat .small{margin-top:6px}
.key{display:flex;gap:14px;padding:0 24px;margin-top:18px}
.key span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);font-weight:500}
.key i{width:8px;height:8px;border-radius:50%}

/* CALENDAR — a month of suns */
.dow,.month{display:grid;grid-template-columns:repeat(7,1fr);padding:0 18px;justify-items:center}
.dow{margin-top:24px;font-size:12px;color:var(--ink3);font-weight:500}
.month{row-gap:10px;margin-top:10px}
.day{width:42px;height:42px;border-radius:50%;background:var(--track);position:relative;display:flex;align-items:center;justify-content:center}
.day b{position:relative;font-size:13px;font-weight:500;letter-spacing:-0.02em;z-index:1}
.day .sun{position:absolute;border-radius:50%;background:var(--coral)}
.day.future{background:transparent;box-shadow:inset 0 0 0 1.5px var(--track)}
.day.future b{color:var(--ink3)}
.day.sel{background:var(--ink)} .day.sel b{color:var(--cream)}
.day .ev{position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:var(--indigo)}
.agenda{margin:0 24px;border-top:1px solid var(--hair)}
.agenda div{display:flex;align-items:center;gap:14px;height:52px;border-bottom:1px solid var(--hair);font-size:15.5px;font-weight:500;letter-spacing:-0.02em}
.agenda .tm{width:52px;font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:0}
.agenda .mk{width:8px;height:8px;border-radius:50%;margin-left:auto}
.transport{position:absolute;left:24px;right:24px;bottom:30px;display:flex;justify-content:space-between;align-items:center}
.transport .side{width:54px;height:54px;background:var(--layer)}
.transport .mid{width:68px;height:68px;background:var(--ink);color:var(--cream);font-size:13px;font-weight:600}

/* TELL NU */
.chips{display:flex;gap:7px;padding:0 24px;margin-top:18px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:17px;background:var(--navy3);border:1px solid rgba(170,185,255,.18);display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--nuSoft)}
.matrix{display:grid;grid-template-columns:repeat(15,1fr);gap:7px;padding:0 24px;margin-top:34px}
.matrix i{aspect-ratio:1;border-radius:50%;background:var(--navy4);display:block}
.matrix i.on{background:var(--nu)}
.matrix i.hi{background:var(--nuSoft)}
.navy .transport .side{background:var(--navy3)}
.navy .transport .mid{width:84px;height:84px;background:var(--indigo);color:#fff}

.board figcaption .tm{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;margin-right:6px}
.navy{--bg:var(--navy);--text:#F2F4FB;--line:rgba(170,185,255,.14);--sub:#929CC5;--mh:#9FA8D0;
  --card:var(--navy3);--card2:var(--navy2);--dotOff:var(--navy4);--dotOn:var(--nu);--dotHi:var(--nuSoft);
  --glyphBg:rgba(170,185,255,.09);--pick:#403B7D;--pickEdge:#7772C2;--dayNum:#AEB6D4;--chipText:var(--nuSoft);
  --accentNu:var(--nu);--warm:#FFB183;--lc-people:#FF9BC2;--lc-work:#8C97F6}
.light .navy{--bg:var(--cream);--text:var(--ink);--line:rgba(23,19,19,.08);--sub:var(--ink3);--mh:var(--mute);
  --card:#FFFFFF;--card2:var(--layer);--dotOff:var(--track);--dotOn:var(--nu);--dotHi:var(--indigo);
  --glyphBg:rgba(23,19,19,.06);--pick:rgba(67,56,202,.09);--pickEdge:var(--indigo);--dayNum:var(--ink2);--chipText:var(--indigo);
  --accentNu:var(--indigo);--warm:var(--coralDeep);--lc-people:#BE185D;--lc-work:#4338CA}
.phone.navy{background:var(--bg);color:var(--text)}
.phone.navy .m{color:var(--mh)}
.phone.navy .chip{background:var(--card);border-color:var(--line);color:var(--chipText)}
.phone.navy .chip svg{stroke:currentColor}
.phone.navy .matrix i{background:var(--dotOff)}
.phone.navy .matrix i.on{background:var(--dotOn)}
.phone.navy .matrix i.hi{background:var(--dotHi)}
.phone.navy .transport .side{background:var(--card);border:1px solid var(--line);color:var(--chipText)}
.phone.navy .transport .side span{color:var(--chipText)!important}
.phone.navy .transport .side svg{stroke:var(--chipText)}
.light .phone.navy .bar img.wm{filter:brightness(0)}
.light .phone.navy .begin{background:var(--ink)!important}

/* top bar: wordmark, and whoever's room this is */
.bar{display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 24px;margin-top:8px;height:44px}
.bar img.wm{height:20px}
.ctile{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.ctile img{width:34px;margin-top:4px}
.navy .ctile{background:var(--card);border:1px solid var(--line)}
.phone:not(.navy) .ctile{background:var(--layer)}
.label{font-size:11px;letter-spacing:1.7px;font-weight:600;color:var(--ink3);padding:0 24px}
.navy .label{color:var(--sub)}

/* the day's path */
.path{position:relative;margin:0 24px}
.path svg{display:block;overflow:visible}
.path .ra{position:absolute;width:52px;transform:translate(-50%,-78%)}
.path .nu{position:absolute;width:44px;transform:translate(-50%,-70%)}
.path .ends{display:flex;justify-content:space-between;align-items:flex-start;margin-top:8px}
.path .ends .num{font-size:22px;letter-spacing:-0.03em}
.path .ends .small{margin-top:3px}
.path .ends .mid{display:flex;flex-direction:column;align-items:center}
.navy .path .ends .num{color:var(--text)}
.navy .small{color:var(--sub)}

/* Home: the stack, on the water */
.stack.g{top:410px;bottom:118px}
.band.dark{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--text)}
.band.dark .head{height:56px}
.band.dark .glyph{background:var(--glyphBg)}
.band.dark .when small{color:var(--sub)}
.stack.g .front{border:0}
.stack.g .front .big{font-size:23px;margin-top:10px;padding-right:40px}
.stack .holder{position:absolute;width:66px;right:10px;z-index:3;pointer-events:none}

/* tab bar, with its labels */
.tabs{position:absolute;left:16px;right:16px;bottom:26px;display:flex;gap:10px;align-items:center;z-index:10}
.tabs .pill{flex:1;height:62px;border-radius:31px;padding:5px;display:flex;background:var(--card2);border:1px solid var(--line)}
.tabs .t{flex:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--sub)}
.tabs .t svg{stroke:currentColor}
.tabs .t.on svg{color:var(--warm)}
.tabs .t.on{background:rgba(255,107,53,.14);color:var(--text)}
.tabs .tell{width:62px;height:62px;border-radius:50%;background:#1B1830;display:flex;align-items:center;justify-content:center}

/* Focus: Nu hands it to Ra */
.burst{position:relative;height:250px;overflow:hidden;margin-top:6px}
.burst svg.b{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
.burst .ra{position:absolute;left:52%;bottom:-6px;transform:translateX(-50%);width:170px}
.burst .nu{position:absolute;left:22px;bottom:0;width:70px}
.burst svg.hand{position:absolute;left:0;top:0}
.burst .line{position:absolute;left:24px;right:24px;bottom:0;height:1.5px;background:var(--ink)}

/* In session */
.ring{position:relative;width:300px;height:300px;margin:22px auto 0}
.ring > svg{position:absolute;inset:0}
.ring .ra{position:absolute;width:64px;transform:translate(-50%,-62%)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.btns{display:flex;justify-content:center;align-items:flex-start;gap:26px;margin-top:26px}
.btns > div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--ink3)}
.link{font-size:14px;font-weight:500;color:var(--indigo)}

/* Your Day */
.days{display:flex;gap:7px;padding:0 24px;margin-top:18px}
.days div{flex:1;height:56px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.days small{font-size:10.5px;letter-spacing:.8px;font-weight:600;color:var(--sub)}
.days b{font-size:18px;font-weight:500;letter-spacing:-0.03em;color:var(--dayNum)}
.days .on{background:var(--pick);border-color:var(--pickEdge)}
.days .on small,.days .on b{color:var(--text)}
.flow{margin:0 24px}
.flow > div{display:flex;align-items:center;gap:14px;height:48px;border-bottom:1px solid var(--line)}
.flow .t{width:44px;font-size:13px;color:var(--sub);font-weight:500}
.flow .x{flex:1;font-size:15.5px;font-weight:500;letter-spacing:-0.02em;color:var(--text)}
.flow .mk{width:10px;height:10px;border-radius:50%;box-sizing:border-box}
.flow .done .x{color:var(--sub);text-decoration:line-through}

/* Night */
.stone{height:56px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;margin:0 12px 6px}
.stone .x{flex:1;font-size:15.5px;font-weight:500;letter-spacing:-0.02em;color:var(--text)}
.stone .glyph{background:var(--glyphBg)}
.stone .w{font-size:13px;color:var(--sub);font-weight:500}

/* the dark round things (Begin, the knobs, Done) lean a little indigo */
:root{--inkNu:#1B1830}
.knob .dial,.circle.begin,.btns .circle[style*="var(--ink)"]{background:var(--inkNu)!important}
.cells .go[style*="var(--ink)"]{background:var(--inkNu)!important}
.light .phone.navy .begin{background:var(--inkNu)!important}
.phone:not(.navy):not(.coral){--hair:rgba(23,19,19,.08)}

/* v4: Focus is just Begin; the knobs live in More options */
.focusgo{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:44px}
.focusgo .more{font-size:15px;font-weight:600;color:var(--ink2)}
.scrim{position:absolute;inset:0;background:rgba(23,19,19,.30);z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--cream);border-radius:30px 30px 0 0;padding:12px 12px 44px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 14px}
.sheet .rows{margin-top:10px}
.sheet .rows > div{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--hair);font-size:16px;font-weight:500;letter-spacing:-0.01em}
.sheet .beginbar{margin-top:18px;height:58px;border-radius:29px;background:var(--coral);color:var(--onCoral);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.nextrow{position:absolute;left:24px;right:24px;bottom:46px;display:flex;align-items:center;gap:18px}

/* v5: every exit top left; the running session lives in a pill above the tabs */
.ctile.exit{background:var(--layer)}
.navy{--pill:#1E2652}
.light .navy{--pill:var(--inkNu)}
.live{position:absolute;left:16px;right:16px;bottom:100px;height:62px;border-radius:31px;background:var(--pill);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 8px 0 8px;z-index:10;color:#F2F4FB}
.live .who{width:46px;height:46px;position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.live .who svg{position:absolute;inset:0}
.live .who img{width:30px;margin-top:2px}
.live .x{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.live .x b{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.live .x span{font-size:12.5px;color:#9FA8D0;font-variant-numeric:tabular-nums}
.live .p{width:46px;height:46px;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;flex:none}
.live .p svg{width:18px;height:18px}

/* v5: the month, in the room's colours */
.navy{--dayFill:var(--navy3);--ring:rgba(170,185,255,.20)}
.light .navy{--dayFill:var(--subtle);--ring:rgba(23,19,19,.14)}
.phone.navy .dow{color:var(--sub);margin-top:22px}
.phone.navy .month{row-gap:8px}
.phone.navy .day{width:40px;height:40px;background:var(--dayFill)}
.phone.navy .day b{color:var(--text)}
.phone.navy .day.future,.phone.navy .day.quiet{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ring)}
.phone.navy .day.future b,.phone.navy .day.quiet b{color:var(--sub)}
.phone.navy .day.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accentNu)}
.phone.navy .day .ev{background:var(--accentNu);bottom:-6px}
.phone.navy .bar .ctile svg{stroke:var(--text)}

/* v6: Your Tasks */
.navy .ctile svg{stroke:var(--sub)}
.tile.add{background:var(--layer)!important}
.navy .tile.add{background:var(--card-2)!important}
.navy{--yt-work:var(--navy3);--yt-study:var(--navy3);--yt-people:var(--navy3);--yt-money:var(--navy3);--yt-personal:var(--navy3);--lc-study:#7FC4FF;--lc-money:#C79BF5;--lc-personal:#5EDCC0;--lc-errands:#FFB183;--lc-health:#7BE495}
.light .navy{--yt-work:var(--t-work);--yt-study:var(--t-study);--yt-people:var(--t-people);--yt-money:var(--t-money);--yt-personal:var(--t-personal);--lc-study:#0369A1;--lc-money:#7E22CE;--lc-personal:#0F766E;--lc-errands:#C2410C;--lc-health:#15803D}
.words.yt{margin-top:20px}
.words.yt span{color:var(--mh)} .words.yt span.on{color:var(--text)}
.words.yt sup{color:var(--sub)}
.bento.yt{top:236px;bottom:112px}
.navy .tile{color:var(--text);border:1px solid var(--line)}
.light .navy .tile{border-color:transparent}
.navy .tile .glyph{background:var(--glyphBg)}
.navy .tile .n small{color:var(--sub)}
.tile.pick{background:var(--coral);color:var(--onCoral)!important;border-color:transparent!important}
.tile.pick .glyph{background:rgba(59,18,4,.10);color:var(--onCoral)}
.tile.pick .n small{color:rgba(59,18,4,.6)!important}
.tile.pick .t{font-size:16px;font-weight:600}
.tile.add{background:var(--card-2);align-items:center;justify-content:center}
.stone.pickstone{background:var(--coral);border-color:transparent}
.stone.pickstone .x,.stone.pickstone .w{color:var(--onCoral)}
.stone.pickstone .glyph{background:rgba(59,18,4,.10);color:var(--onCoral)}

/* v6 C: everything sinks, one thing rises — in v5's vocabulary */
.navy{--water:var(--navy2)}
.light .navy{--water:#EFE9DB}
.rising{margin:20px 12px 0;border-radius:28px;background:var(--coral);color:var(--onCoral);padding:16px 18px 16px}
.rising .glyph{background:rgba(59,18,4,.10);color:var(--onCoral)}
.rising .k{font-size:13px;font-weight:600}
.rising .tt{font-size:21px;font-weight:600;letter-spacing:-0.04em;line-height:1.08;margin-top:8px;padding-right:30px}
.rising .foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px}
.surface{position:relative;height:28px;margin-top:30px}
.surface .wave{position:absolute;left:0;top:0}
.surface .nu{position:absolute;left:22px;top:-30px;width:50px;z-index:2}
.water{position:relative;height:560px;background:var(--water);padding:8px 24px 0}
.navy{--waterLine:rgba(140,151,246,.55)}
.light .navy{--waterLine:rgba(67,56,202,.40)}
.label.wl{padding:0;margin:16px 0 4px}
.deep{height:52px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.deep .glyph{width:30px;height:30px;background:var(--glyphBg)}
.deep .glyph svg{width:16px;height:16px}
.deep .xx{flex:1;min-width:0}
.deep .x{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px;font-weight:500;letter-spacing:-0.02em;color:var(--text)}
.deep .w{text-align:right;font-size:22px;letter-spacing:-0.04em;color:var(--text)}
.deep .w small{font-size:11px;letter-spacing:0;color:var(--sub);margin-left:1px}
.deep.d2{opacity:.62}
.deep.d3{opacity:.38;height:46px}
</style>

.band.dark .glyph{background:rgba(255,255,255,.16)!important}
.band.dark .glyph svg{stroke:currentColor}
.band.dark .glyph{color:inherit!important}
.band.dark .when small{color:inherit!important;opacity:.6}
.band.dark .title{color:inherit}

const modeFromHash = () => 'light';
function setMode(m) {
  document.body.classList.toggle('light', m === 'light');

  const ink = dark ? '#AEB6D4' : css('--ink'), dim = dark ? 'rgba(170,185,255,.30)' : 'rgba(23,19,19,.28)';
  const xAt = p => x0 + p * (x1 - x0);
  const yAt = p => hz - A * Math.sin(Math.PI * p);
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('width', W); s.setAttribute('height', H);
  let d = '';
  for (let i = 0; i <= 80; i++) { const p = i / 80; d += (i ? 'L' : 'M') + xAt(p).toFixed(1) + ' ' + yAt(p).toFixed(1); }
  s.innerHTML += `<line x1="0" y1="${hz}" x2="${W}" y2="${hz}" stroke="${dim}" stroke-width="1.2"/>`;
  s.innerHTML += `<path d="${d}" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round" opacity="${o.now > 1 ? .45 : .9}"/>`;
  for (let i = 1; i <= 7; i++) {
    const p = -i * 0.018, q = 1 + i * 0.018;
    [p, q].forEach(v => s.innerHTML += `<circle cx="${xAt(v)}" cy="${yAt(v)}" r="1.6" fill="${dim}"/>`);
  }
  [0, 1].forEach(v => s.innerHTML += `<circle cx="${xAt(v)}" cy="${hz}" r="4" fill="${ink}"/>`);
  (o.events || []).forEach(v => s.innerHTML += `<rect x="${xAt(v) - 1}" y="${hz + 6}" width="2" height="9" rx="1" fill="${dark ? css('--nu') : css('--indigo')}"/>`);
  (o.risen || []).forEach(v => s.innerHTML += `<circle cx="${xAt(v)}" cy="${yAt(v)}" r="6" fill="${css('--coral')}" stroke="${dark ? css('--navy') : css('--cream')}" stroke-width="2.5"/>`);
  if (o.now <= 1) s.innerHTML += `<line x1="${xAt(o.now)}" y1="${yAt(o.now)}" x2="${xAt(o.now)}" y2="${hz}" stroke="${ink}" stroke-width="1.2" stroke-dasharray="2 3"/>`;
  el.appendChild(s);
  const ra = document.createElement('img'); ra.className = 'ra'; ra.src = IMG[o.ra];
  ra.style.left = xAt(Math.min(o.now, 1)) + 'px';
  ra.style.top = yAt(Math.min(o.now, 1)) + 'px';
  // past the end of the day, Ra has set: half of it below the horizon
  // past the end of the day Ra sits down at the horizon, eyes closed
  if (o.now > 1) { ra.style.width = '92px'; ra.style.left = (xAt(1) - 20) + 'px'; ra.style.top = (hz + 4) + 'px'; ra.style.transform = 'translate(-50%,-88%)'; }
  el.appendChild(ra);
  // Nu, at the water where the day starts
  if (o.nu) { const nu = document.createElement('img'); nu.className = 'nu'; nu.src = IMG.NU_HELLO; nu.style.left = (xAt(0) - 10) + 'px'; nu.style.top = hz + 'px'; el.appendChild(nu); }
  const n = (o.risen || []).length;
  el.insertAdjacentHTML('beforeend', `<div class="ends">
    <div><div class="num">7:00</div><div class="small">Start</div></div>
    <div class="mid"><svg width="26" height="18" viewBox="-13 -16 26 18">${[0,1,2,3,4,5,6].map(k => { const a = Math.PI * k / 6; return `<circle cx="${(-Math.cos(a) * 11).toFixed(1)}" cy="${(-Math.sin(a) * 11).toFixed(1)}" r="1.6" fill="${css('--coral')}"/>`; }).join('')}<circle cx="0" cy="0" r="5" fill="${css('--coral')}"/></svg><div class="small" style="margin-top:4px">${n} done</div></div>
    <div style="text-align:right"><div class="num">11:45</div><div class="small">Day ends</div></div></div>`);
});
dm('dmClock', '11:50', 9, document.getElementById('dmClock').closest('.light') ? css('--ink') : '#F2F4FB', '');
}

// a sun drawn in dots
function burst(id, color, full) {
  const s = document.getElementById(id);
  const rings = [0, 22, 40, 58, 76, 94, 112, 130, 148, 166];
  rings.forEach((r, i) => {
    const n = r ? Math.round(2 * Math.PI * r / 17) : 1;
    const size = r ? Math.max(1.6, 6.2 - i * 0.5) : 17;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2 + i * 0.3;
      const x = r * Math.cos(a), y = r * Math.sin(a);
      if (!full && y > 2) continue;
      s.insertAdjacentHTML('beforeend', `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size}" fill="${color}" opacity="${(1 - i * 0.075).toFixed(2)}"/>`);
    }
  });
}
burst('burst', css('--coral'), false);
burst('burst2', css('--coral'), false);
burst('burstDone', css('--cream'), true);

// dot-matrix numerals
const F = {
  '0':['01110','10001','10011','10101','11001','10001','01110'], '1':['00100','01100','00100','00100','00100','00100','01110'],
  '2':['01110','10001','00001','00010','00100','01000','11111'], '3':['11110','00001','00001','01110','00001','00001','11110'],
  '4':['00010','00110','01010','10010','11111','00010','00010'], '5':['11111','10000','11110','00001','00001','10001','01110'],
  '6':['00110','01000','10000','11110','10001','10001','01110'], '7':['11111','00001','00010','00100','01000','01000','01000'],
  '8':['01110','10001','10001','01110','10001','10001','01110'], '9':['01110','10001','10001','01111','00001','00010','01100'],
  ':':['0','0','1','0','1','0','0']
};
function dm(id, str, dot, color, mute, muteN = 0) {
  const s = document.getElementById(id); let x = 0, out = '';
  [...str].forEach((ch, ci) => {
    const g = F[ch], w = g[0].length, c = ci < muteN ? mute : color;
    g.forEach((row, ry) => [...row].forEach((b, rx) => {
      if (b === '1') out += `<circle cx="${(x + rx) * dot + dot / 2}" cy="${ry * dot + dot / 2}" r="${dot * 0.38}" fill="${c}"/>`;
    }));
    x += w + 1;
  });
  s.setAttribute('width', (x - 1) * dot); s.setAttribute('height', 7 * dot); s.innerHTML = out;
}
dm('dmTimer', '08:20', 6.2, css('--ink'), 'rgba(23,19,19,.22)', 1);
draw();
document.querySelectorAll('#modeToggle button').forEach(btn => btn.onclick = () => { setMode(btn.dataset.m); draw(); });

// the session ring: 15 minutes of ticks, Ra where you are
(() => {
  const s = document.getElementById('ringSvg'), c = 150, R = 128, N = 60, p = 6.67 / 15;
  let out = `<circle cx="${c}" cy="${c}" r="${R - 22}" fill="${css('--layer')}" stroke="rgba(23,19,19,.08)" stroke-width="1"/>`;
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + (i / N) * Math.PI * 2, on = i / N < p, big = i % 5 === 0;
    const r1 = R - (big ? 12 : 7), r2 = R + (on ? 4 : 0);
    out += `<line x1="${(c + r1 * Math.cos(a)).toFixed(1)}" y1="${(c + r1 * Math.sin(a)).toFixed(1)}" x2="${(c + r2 * Math.cos(a)).toFixed(1)}" y2="${(c + r2 * Math.sin(a)).toFixed(1)}" stroke="${on ? css('--coral') : 'rgba(23,19,19,.30)'}" stroke-width="${on ? 3 : 1.6}" stroke-linecap="round"/>`;
  }
  s.innerHTML = out;
  const a = -Math.PI / 2 + p * Math.PI * 2, ra = document.getElementById('ringRa');
  ra.style.left = (c + (R + 6) * Math.cos(a)) + 'px'; ra.style.top = (c + (R + 6) * Math.sin(a)) + 'px';
})();


// the month: each day's sun is as big as what got done — a quiet day is simply a small, empty circle
(() => {
  const el = document.getElementById('monthG'); if (!el) return;
  const done = {1:2,2:4,4:3,7:5,8:2,9:3,10:1,11:4,14:2,15:6,16:3,17:2,18:4,21:1,22:3,23:5,24:2,25:3};
  const events = [2,9,14,16,21,23,25,29];
  el.insertAdjacentHTML('beforeend', '<span></span>'); // 1 September 2026 is a Tuesday
  for (let d = 1; d <= 30; d++) {
    const n = done[d] || 0, past = d <= 25;
    const size = n ? Math.min(40, 12 + n * 5) : 0;
    const cls = [d === 25 ? 'sel' : '', !past ? 'future' : !n ? 'quiet' : ''].join(' ');
    el.insertAdjacentHTML('beforeend',
      `<span class="day ${cls}">${n ? `<span class="sun" style="width:${size}px;height:${size}px"></span>` : ''}<b>${d}</b>${events.includes(d) ? '<span class="ev"></span>' : ''}</span>`);
  }
})();

// Tell Nu: a voice in dots
(() => {
  const el = document.getElementById('matrix');
  const cols = 15, rows = 11, mid = 5;
  const amp = [0,1,3,1,4,5,2,0,3,5,3,1,2,0,0];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = amp[c], on = Math.abs(r - mid) <= a;
    el.insertAdjacentHTML('beforeend', `<i class="${on ? (Math.abs(r - mid) <= a - 2 ? 'hi' : 'on') : ''}"></i>`);
  }
})();
</script>

// #only=N shows just screen N, edge to edge, for exporting
