<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nura journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --cream:#FAF7F0; --layer:#F3EEE2; --subtle:#EFE9DB; --track:#E8E1D2; --card:#FFFFFF;
  --ink:#171313; --ink2:#4A4340; --ink3:#7B7360; --mute:#958B77;
  --hair:rgba(23,19,19,.10); --hair2:rgba(23,19,19,.18);
  --coral:#FF6B35; --coralSoft:#FFA05C; --coralDeep:#C2410C; --onCoral:#3B1204;
  --navy:#0B1029; --navy2:#111838; --navy3:#161D42; --navy4:#1E2652;
  --indigo:#4338CA; --nu:#8C97F6; --nuSoft:#B6BEFA; --nuInk3:#7E87AC;
  --t-people:#FCCBDB; --t-money:#E6D3F6; --t-work:#CFD4F7; --t-study:#CBE4F9; --t-home:#F8E7BC; --t-personal:#C7EEE4;
  --font:'Inter Tight', system-ui, sans-serif; --tight:-0.045em;
}
body.poppins{ --font:'Poppins', system-ui, sans-serif; --tight:-0.035em; }
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E6E2D8}
body{font-family:var(--font);color:var(--ink);padding:40px 48px 80px;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:18px;margin-bottom:40px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-0.02em}
.toggle{display:flex;gap:4px;padding:4px;border-radius:99px;background:#fff;border:1px solid var(--hair)}
.toggle button{font:500 13px var(--font);border:0;background:transparent;padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--ink3)}
.toggle button.on{background:var(--ink);color:var(--cream)}
.board{display:flex;flex-wrap:wrap;gap:56px 44px}
.board figure{display:flex;flex-direction:column;gap:14px}
.board figcaption{font-size:13px;color:#6b665c;font-weight:500;padding-left:6px}
.board figcaption b{color:var(--ink);font-weight:600}

/* the phone */
.phone{width:390px;height:844px;border-radius:50px;position:relative;overflow:hidden;background:var(--cream);
  box-shadow:0 0 0 9px #111114, 0 0 0 10px #2a2a2e, 0 40px 70px -20px rgba(40,30,10,.35)}
.phone.navy{background:var(--navy);color:#F2F4FB}
.phone.coral{background:var(--coral);color:var(--onCoral)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:20}
.sb{height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 38px;font-size:15.5px;font-weight:600;letter-spacing:-0.01em;position:relative;z-index:5}
.sb svg{display:block}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:currentColor;opacity:.9;z-index:20}

.pad{padding:0 24px}
.h{font-weight:600;letter-spacing:var(--tight);line-height:1.02}
.m{color:var(--mute)}
.navy .m{color:var(--nuInk3)}
.coral .m{color:rgba(59,18,4,.5)}
.num{font-weight:400;letter-spacing:-0.05em;line-height:.9;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:0}
.row{display:flex;align-items:center}
.circle{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.glyph{width:32px;height:32px;border-radius:50%;background:rgba(23,19,19,.07);display:flex;align-items:center;justify-content:center;flex:none}
.coral .glyph,.front .glyph{background:rgba(59,18,4,.10)}

/* nav */
.nav{position:absolute;left:16px;right:16px;bottom:26px;display:flex;gap:10px;align-items:center;z-index:10}
.nav .pill{flex:1;height:62px;border-radius:31px;background:var(--layer);display:flex;align-items:center;justify-content:space-around;border:1px solid var(--hair)}
.nav .tab{width:62px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.nav .tab i{width:5px;height:5px;border-radius:50%;background:transparent}
.nav .tab.on i{background:var(--coral)}
.nav .tell{width:62px;height:62px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center}

/* HOME — the stack */
.stack{position:absolute;left:12px;right:12px;top:214px;bottom:104px}
.band{position:absolute;left:0;right:0;height:230px;border-radius:28px;padding:0 20px;background:var(--c);
  box-shadow:0 -1px 0 rgba(255,255,255,.6) inset, 0 -8px 20px -12px rgba(40,30,10,.18)}
.band .head{height:62px;display:flex;align-items:center;gap:12px}
.band .title{flex:1;font-size:16.5px;font-weight:500;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .when{font-size:24px;letter-spacing:-0.04em;font-weight:400}
.band .when small{font-size:11px;letter-spacing:0;color:var(--ink3);margin-left:2px;font-weight:500}
.front{background:var(--coral);color:var(--onCoral);height:auto;bottom:0;padding:18px 20px 20px;display:flex;flex-direction:column}
.front .big{font-size:31px;font-weight:600;letter-spacing:var(--tight);line-height:1.04;margin-top:16px}
.front .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
.begin{width:96px;height:96px;background:var(--ink);color:var(--cream);font-size:16px;font-weight:600;letter-spacing:-0.01em}

/* TASKS — sized by time */
.words{display:flex;gap:18px;white-space:nowrap;font-size:30px;font-weight:600;letter-spacing:var(--tight);padding:0 24px;margin-top:22px}
.words span{color:var(--mute)} .words span.on{color:var(--ink)}
.words sup{font-size:11px;font-weight:500;letter-spacing:0;margin-left:2px;vertical-align:18px}
.bento{position:absolute;left:12px;right:12px;top:236px;bottom:104px;display:grid;gap:7px;
  grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr 1fr;
  grid-template-areas:"a a b" "a a b" "c c d" "e f g"}
.tile{border-radius:24px;padding:14px;background:var(--c);display:flex;flex-direction:column;position:relative;overflow:hidden}
.tile .t{font-size:14.5px;font-weight:500;letter-spacing:-0.02em;line-height:1.18;margin-top:auto}
.tile .n{font-size:30px;letter-spacing:-0.05em;position:absolute;top:12px;right:14px}
.tile .n small{font-size:11px;letter-spacing:0;color:var(--ink3);font-weight:500;margin-left:1px}
.tile.xl .t{font-size:22px;font-weight:600;letter-spacing:var(--tight);line-height:1.06}
.tile.xl .n{font-size:84px;top:auto;bottom:10px;right:16px}
.tile.xl .n small{font-size:13px}
.tile.xl .t{margin-top:18px}

/* FOCUS */
.back{font-size:15px;color:var(--ink3);font-weight:500}
.horizon{position:relative;height:230px;overflow:hidden;margin-top:14px}
.horizon .disc{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%}
.ticks{position:absolute;left:0;right:0;bottom:0;height:14px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px;border-top:1.5px solid var(--ink)}
.ticks i{width:1.5px;height:6px;background:var(--ink2);display:block}
.ticks i:nth-child(5n+1){height:12px;background:var(--ink)}
.knobs{display:flex;gap:8px;padding:0 12px;margin-top:14px}
.knob{flex:1;height:150px;border-radius:26px;background:var(--layer);padding:14px 16px;position:relative}
.knob .dial{position:absolute;right:16px;top:16px;width:84px;height:84px;background:var(--ink);border-radius:50%}
.knob .dial i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--coral)}
.knob .v{font-size:28px;letter-spacing:-0.05em;position:absolute;left:16px;bottom:34px}
.knob .v small{font-size:12px;letter-spacing:0;color:var(--ink3);font-weight:500}
.knob .l{position:absolute;left:16px;bottom:14px;font-size:12.5px;color:var(--ink2);font-weight:500}
.cells{position:absolute;left:0;right:0;bottom:0;height:196px;display:flex;border-top:1px solid var(--hair)}
.cells > div{flex:1;display:flex;align-items:center;justify-content:center}
.cells > div + div{border-left:1px solid var(--hair)}
.go{width:124px;height:124px;font-size:18px;font-weight:600;letter-spacing:-0.01em}

/* SESSION */
.player{display:flex;gap:1px;margin:0 12px;border-radius:24px;overflow:hidden;background:var(--hair)}
.player > div{flex:1;height:100px;background:var(--layer);display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600}
.ruler{position:absolute;left:12px;right:12px;bottom:34px;height:58px;border-radius:0 0 30px 30px;background:var(--ink);overflow:hidden}
.ruler .fill{position:absolute;left:0;top:0;bottom:0;background:var(--coral)}
.ruler .ts{position:absolute;left:14px;right:14px;top:0;height:22px;display:flex;justify-content:space-between;align-items:flex-start}
.ruler .ts i{width:1.5px;height:8px;background:rgba(250,247,240,.55);display:block}
.ruler .ts i:nth-child(5n+1){height:16px;background:var(--cream)}
.ruler .head{position:absolute;top:0;bottom:0;width:2px;background:var(--cream)}

/* DAY — the day in dots */
.dots{display:grid;grid-template-columns:30px repeat(8, 30px);gap:9px 8px;align-items:center;padding:0 24px;margin-top:26px}
.dots .hr{font-size:11px;color:var(--ink3);font-weight:500;text-align:left}
.dots .d{width:30px;height:30px;border-radius:50%;background:var(--track)}
.dots .d.past{background:#F0EBE0}
.dots .d.cal{background:var(--indigo)}
.dots .d.task{background:var(--coral)}
.dots .d.done{background:var(--ink)}
.dots .d.now{box-shadow:0 0 0 2.5px var(--cream),0 0 0 4.5px var(--ink)}
.stats{display:flex;justify-content:space-between;padding:0 24px;margin-top:26px}
.stat .num{font-size:38px}
.stat .small{margin-top:6px}
.key{display:flex;gap:14px;padding:0 24px;margin-top:18px}
.key span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);font-weight:500}
.key i{width:8px;height:8px;border-radius:50%}

/* CALENDAR — a month of suns */
.dow,.month{display:grid;grid-template-columns:repeat(7,1fr);padding:0 18px;justify-items:center}
.dow{margin-top:24px;font-size:12px;color:var(--ink3);font-weight:500}
.month{row-gap:10px;margin-top:10px}
.day{width:42px;height:42px;border-radius:50%;background:var(--track);position:relative;display:flex;align-items:center;justify-content:center}
.day b{position:relative;font-size:13px;font-weight:500;letter-spacing:-0.02em;z-index:1}
.day .sun{position:absolute;border-radius:50%;background:var(--coral)}
.day.future{background:transparent;box-shadow:inset 0 0 0 1.5px var(--track)}
.day.future b{color:var(--ink3)}
.day.sel{background:var(--ink)} .day.sel b{color:var(--cream)}
.day .ev{position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:var(--indigo)}
.agenda{margin:0 24px;border-top:1px solid var(--hair)}
.agenda div{display:flex;align-items:center;gap:14px;height:52px;border-bottom:1px solid var(--hair);font-size:15.5px;font-weight:500;letter-spacing:-0.02em}
.agenda .tm{width:52px;font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:0}
.agenda .mk{width:8px;height:8px;border-radius:50%;margin-left:auto}
.transport{position:absolute;left:24px;right:24px;bottom:30px;display:flex;justify-content:space-between;align-items:center}
.transport .side{width:54px;height:54px;background:var(--layer)}
.transport .mid{width:68px;height:68px;background:var(--ink);color:var(--cream);font-size:13px;font-weight:600}

/* TELL NU */
.chips{display:flex;gap:7px;padding:0 24px;margin-top:18px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:17px;background:var(--navy3);border:1px solid rgba(170,185,255,.18);display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--nuSoft)}
.matrix{display:grid;grid-template-columns:repeat(15,1fr);gap:7px;padding:0 24px;margin-top:34px}
.matrix i{aspect-ratio:1;border-radius:50%;background:var(--navy4);display:block}
.matrix i.on{background:var(--nu)}
.matrix i.hi{background:var(--nuSoft)}
.navy .transport .side{background:var(--navy3)}
.navy .transport .mid{width:84px;height:84px;background:var(--indigo);color:#fff}

.board figcaption .tm{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;margin-right:6px}
.path{position:relative;margin:0 24px}
.path svg{display:block;overflow:visible}
.path .ra{position:absolute;width:52px;transform:translate(-50%,-78%)}
.path .ends{display:flex;justify-content:space-between;align-items:flex-start;margin-top:8px}
.path .ends .num{font-size:22px;letter-spacing:-0.03em}
.path .ends .small{margin-top:3px}
.path .ends .mid{display:flex;flex-direction:column;align-items:center}
.stack.f{top:396px;bottom:118px}
.stack.f .front .big{font-size:26px;margin-top:12px}
.nav .peek{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;width:50px;z-index:-1}
.ring{position:relative;width:300px;height:300px;margin:26px auto 0}
.ring > svg{position:absolute;inset:0}
.ring .ra{position:absolute;width:62px;transform:translate(-50%,-60%)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.btns{display:flex;justify-content:center;align-items:flex-start;gap:26px;margin-top:30px}
.btns > div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--ink3)}
.burst{position:relative;height:250px;overflow:hidden;margin-top:6px}
.burst svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
.burst img{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:170px}
.burst .line{position:absolute;left:24px;right:24px;bottom:0;height:1.5px;background:var(--ink)}
.flow{margin:0 24px}
.flow > div{display:flex;align-items:center;gap:14px;height:54px;border-bottom:1px solid var(--hair)}
.flow .t{width:44px;font-size:13px;color:var(--ink3);font-weight:500}
.flow .x{flex:1;font-size:16px;font-weight:500;letter-spacing:-0.02em}
.flow .mk{width:10px;height:10px;border-radius:50%}
.flow .done .x{color:var(--ink3);text-decoration:line-through}
.navy .path .ends .num{color:#F2F4FB}
.navy .small{color:var(--nuInk3)}
.sliver-n{height:56px;border-radius:22px;background:var(--navy3);border:1px solid rgba(170,185,255,.12);display:flex;align-items:center;gap:12px;padding:0 16px;margin:0 12px 6px}
.sliver-n .x{flex:1;font-size:15.5px;font-weight:500;letter-spacing:-0.02em;color:#F2F4FB}
.sliver-n .glyph{background:rgba(170,185,255,.10);color:var(--nuSoft)}
.sliver-n .w{font-size:13px;color:var(--nuInk3);font-weight:500}
</style>
</head>
<body>

<div class="top">
  <h1>Nura · A day with Nu and Ra</h1>
  <div class="toggle" id="typeToggle">
    <button class="on" data-f="inter">Inter Tight</button>
    <button data-f="poppins">Poppins</button>
  </div>
</div>

<div class="board">

<!-- 1 · MORNING -->
<figure>
<figcaption><span class="tm">7:12</span><b>Home</b> — Ra rises on the day's path</figcaption>
<div class="phone">
  <div class="island"></div>
  <div class="sb"><span>7:12</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 008 .5 10.2 10.2 0 00.8 3.4L2 4.6a8.5 8.5 0 016-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 008 3.9a6.8 6.8 0 00-4.8 1.9L4.4 7A5.1 5.1 0 018 5.6zM8 9l2-2a2.8 2.8 0 00-4 0z"/></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg></span></div>
  <div class="pad row" style="justify-content:space-between;align-items:flex-start;margin-top:14px">
    <div class="h" style="font-size:34px">Good morning.<br><span class="m">5 things, 2 meetings.</span></div>
    <div class="circle" style="width:40px;height:40px;background:var(--layer);margin-top:2px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.3 16.3L21 21"/></svg></div>
  </div>
  <div class="path" style="margin-top:34px" data-path='{"now":0.02,"risen":[],"events":[0.17,0.37],"ra":"RA_HELLO","h":130}'></div>
  <div class="stack f">
    <div class="band" style="--c:var(--t-people);top:0"><div class="head"><div class="glyph"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.2" r="3.2"/><path d="M2.8 19.4c.8-3.1 3.3-4.9 6.2-4.9s5.4 1.8 6.2 4.9"/><path d="M16.2 5.4a3.2 3.2 0 010 5.9M17.6 14.9c2.1.5 3.4 2.1 3.9 4.5"/></svg></div><div class="title">Call mum</div><div class="when">6:00<small>PM</small></div></div></div>
    <div class="band" style="--c:var(--t-work);top:60px"><div class="head"><div class="glyph"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2 2 0 015 6.5h14a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 6.5V5a2 2 0 012-2h2a2 2 0 012 2v1.5M3 12h18"/></svg></div><div class="title">Prepare slides for Monday</div><div class="when">45<small>min</small></div></div></div>
    <div class="band front" style="top:120px">
      <div class="row" style="gap:10px"><div class="glyph"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 10.6L12 3.8l8.6 6.8"/><path d="M5.5 9.4V19a1.4 1.4 0 001.4 1.4h10.2A1.4 1.4 0 0018.5 19V9.4"/></svg></div><span style="font-size:13px;font-weight:600">Home</span><span style="margin-left:auto;font-size:13px;font-weight:600">High</span></div>
      <div class="big">Email the landlord about the heating</div>
      <div class="foot">
        <div class="circle begin" style="width:84px;height:84px">Begin</div>
        <div class="num" style="font-size:64px">15<small style="font-size:14px;letter-spacing:0;font-weight:500;margin-left:3px">min</small></div>
      </div>

  el.insertAdjacentHTML('beforeend', `<div class="ends">

    <div class="mid"><svg width="26" height="18" viewBox="-13 -16 26 18">${[0,1,2,3,4,5,6].map(k => { const a = Math.PI * k / 6; return `<circle cx="${(-Math.cos(a) * 11).toFixed(1)}" cy="${(-Math.sin(a) * 11).toFixed(1)}" r="1.6" fill="${css('--coral')}"/>`; }).join('')}<circle cx="0" cy="0" r="5" fill="${css('--coral')}"/></svg><div class="small" style="margin-top:4px">${n} risen</div></div>
    <div style="text-align:right"><div class="num">11:45</div><div class="small">Day ends</div></div></div>`);
});

// a sun drawn in dots
function burst(id, color, full) {
  const s = document.getElementById(id);
  const rings = [0, 22, 40, 58, 76, 94, 112, 130, 148, 166];
  rings.forEach((r, i) => {
    const n = r ? Math.round(2 * Math.PI * r / 17) : 1;
    const size = r ? Math.max(1.6, 6.2 - i * 0.5) : 17;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2 + i * 0.3;
      const x = r * Math.cos(a), y = r * Math.sin(a);
      if (!full && y > 2) continue;
      s.insertAdjacentHTML('beforeend', `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size}" fill="${color}" opacity="${(1 - i * 0.075).toFixed(2)}"/>`);
    }
  });
}
burst('burst', css('--coral'), false);
burst('burstDone', css('--cream'), true);

// dot-matrix numerals
const F = {
  '0':['01110','10001','10011','10101','11001','10001','01110'], '1':['00100','01100','00100','00100','00100','00100','01110'],
  '2':['01110','10001','00001','00010','00100','01000','11111'], '3':['11110','00001','00001','01110','00001','00001','11110'],
  '4':['00010','00110','01010','10010','11111','00010','00010'], '5':['11111','10000','11110','00001','00001','10001','01110'],
  '6':['00110','01000','10000','11110','10001','10001','01110'], '7':['11111','00001','00010','00100','01000','01000','01000'],
  '8':['01110','10001','10001','01110','10001','10001','01110'], '9':['01110','10001','10001','01111','00001','00010','01100'],
  ':':['0','0','1','0','1','0','0']
};
function dm(id, str, dot, color, mute, muteN = 0) {
  const s = document.getElementById(id); let x = 0, out = '';
  [...str].forEach((ch, ci) => {
    const g = F[ch], w = g[0].length, c = ci < muteN ? mute : color;
    g.forEach((row, ry) => [...row].forEach((b, rx) => {
      if (b === '1') out += `<circle cx="${(x + rx) * dot + dot / 2}" cy="${ry * dot + dot / 2}" r="${dot * 0.38}" fill="${c}"/>`;
    }));
    x += w + 1;
  });
  s.setAttribute('width', (x - 1) * dot); s.setAttribute('height', 7 * dot); s.innerHTML = out;
}
dm('dmTimer', '08:20', 6.2, css('--ink'), 'rgba(23,19,19,.22)', 1);
dm('dmClock', '11:50', 9, '#F2F4FB', '#F2F4FB');

// the session ring: 15 minutes of ticks, Ra where you are
(() => {
  const s = document.getElementById('ringSvg'), c = 150, R = 128, N = 60, p = 6.67 / 15;
  let out = `<circle cx="${c}" cy="${c}" r="${R - 22}" fill="${css('--layer')}"/>`;
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + (i / N) * Math.PI * 2, on = i / N < p, big = i % 5 === 0;
    const r1 = R - (big ? 12 : 7), r2 = R + (on ? 4 : 0);
    out += `<line x1="${(c + r1 * Math.cos(a)).toFixed(1)}" y1="${(c + r1 * Math.sin(a)).toFixed(1)}" x2="${(c + r2 * Math.cos(a)).toFixed(1)}" y2="${(c + r2 * Math.sin(a)).toFixed(1)}" stroke="${on ? css('--coral') : 'rgba(23,19,19,.30)'}" stroke-width="${on ? 3 : 1.6}" stroke-linecap="round"/>`;
  }
  s.innerHTML = out;
  const a = -Math.PI / 2 + p * Math.PI * 2, ra = document.getElementById('ringRa');
  ra.style.left = (c + (R + 6) * Math.cos(a)) + 'px'; ra.style.top = (c + (R + 6) * Math.sin(a)) + 'px';
})();

// Tell Nu: a voice in dots
(() => {
  const el = document.getElementById('matrix');
  const cols = 15, rows = 11, mid = 5;
  const amp = [0,1,3,1,4,5,2,0,3,5,3,1,2,0,0];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = amp[c], on = Math.abs(r - mid) <= a;
    el.insertAdjacentHTML('beforeend', `<i class="${on ? (Math.abs(r - mid) <= a - 2 ? 'hi' : 'on') : ''}"></i>`);
  }
})();
</script>
<script>
// #only=N shows just screen N, edge to edge, for exporting
(() => { const m = location.hash.match(/only=(\d+)/); if (!m) return;
  const figs = [...document.querySelectorAll('.board figure')], f = figs[+m[1]];
  document.querySelector('.top').remove();
  figs.forEach(x => { if (x !== f) x.remove(); });
  f.querySelector('figcaption').remove();
  document.body.style.padding = '0'; document.documentElement.style.background = 'transparent';
  const p = f.querySelector('.phone'); p.style.borderRadius = '0'; p.style.boxShadow = 'none';
})();
</script>
