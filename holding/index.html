<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nura</title>
  <link rel="icon" href="ra-hello.webp">
  <style>
    @font-face { font-family: 'Inter Tight'; font-weight: 600; font-display: swap; src: url(fonts/InterTight-600.woff) format('woff'); }
    @font-face { font-family: 'Inter Tight'; font-weight: 500; font-display: swap; src: url(fonts/InterTight-500.woff) format('woff'); }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: linear-gradient(180deg, #FFFFFF 0%, #FFF3E6 100%);
           color: #171313; font: 500 17px/1.5 'Inter Tight', system-ui, -apple-system, sans-serif; text-align: center; }
    main { padding: 24px; }
    img { width: 140px; height: auto; }
    h1 { font-weight: 600; font-size: 44px; letter-spacing: -0.03em; margin: 12px 0 4px; }
    p { margin: 0; color: #6E6654; }
  </style>
</head>
<body>
  <main>
    <img src="ra-hello.webp" alt="Ra, waving" width="140">

    <p>Coming soon.</p>
